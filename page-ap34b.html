<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АП-34Б — Пункты проверок</title>

<style>
:root{
  --bg1:#0b1a2a; --bg2:#153a5a;
  --card:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.18);
  --text:#e9f2ff; --muted:#b7c7dd;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 15% 10%, rgba(255,255,255,.12), transparent 60%),
    radial-gradient(800px 500px at 85% 20%, rgba(255,255,255,.10), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
}

.wrap{max-width:1300px;margin:0 auto;padding:18px}
.card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:18px;
  padding:14px;
  backdrop-filter:blur(6px);
  box-shadow:0 18px 40px rgba(0,0,0,.25);
}

.hub{margin-top:12px;display:grid;grid-template-columns:380px 1fr;gap:12px}
.menu{
  border:1px solid var(--stroke);
  border-radius:16px;
  padding:10px;
  background:rgba(0,0,0,.18);
  max-height:78vh; overflow:auto;
}
.item{
  display:flex;gap:10px;
  padding:12px;border-radius:14px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);
  cursor:pointer;margin-bottom:10px;
}
.item.active{background:rgba(255,255,255,.14)}
.num{
  min-width:42px;text-align:center;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.25);
  font-weight:800;
}

.viewer{
  border:1px solid var(--stroke);
  border-radius:16px;
  padding:10px;
  background:rgba(0,0,0,.12);
}

iframe{
  width:100%;height:58vh;
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  background:#000;
}

/* ГАЛЕРЕЯ */
.gallery{
  margin-top:12px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.gallery img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.2);
}

/* МОДАЛЬНОЕ ОКНО */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;justify-content:center;
  z-index:1000;
}
.modal img{
  max-width:95%;max-height:95%;
  border-radius:14px;
}
.modal.active{display:flex}

/* КНОПКА НАЗАД */
.back{
  display:none;
  margin-bottom:8px;
  padding:6px 10px;
  border-radius:10px;
  border:1px solid var(--stroke);
  background:rgba(0,0,0,.35);
  cursor:pointer;
  width:max-content;
}

@media(max-width:900px){
  .hub{grid-template-columns:1fr}
  iframe{height:45vh}
  .gallery{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<div class="wrap">
<div class="card">
<h2>АП-34Б · Пункты проверок</h2>

<div class="hub">
  <div class="menu" id="menu"></div>

  <div class="viewer">
    <div class="back" id="back">← Назад</div>
    <iframe id="frame"></iframe>

    <!-- ФОТО -->
    <div class="gallery">
      <img src="./AP/00.jpg">
      <img src="./AP/01.jpg">
      <img src="./AP/02.jpg">
      <img src="./AP/03.jpg">
    </div>
  </div>
</div>

</div>
</div>

<!-- МОДАЛ -->
<div class="modal" id="modal"><img></div>

<script>
const BASE = './AP/';
const items = [
{id:'01',title:'Выписки из РЛЭ'},
{id:'02',title:'Проверка работоспособности автопилота без КПА в предварительную подготовку'},
{id:'03',title:'Проверка остаточного сигнала'},
{id:'04',title:'Проверка коэффициента усиления автопилота'},
{id:'05',title:'Проверка скорости согласования автопилота по каналам направления, крена и тангажа'},
{id:'06',title:'Проверка передаточного сигнала КДТ'},
{id:'07',title:'Проверка передаточного сигнала КДК'},
{id:'08',title:'Проверка передаточного сигнала по углу'},
{id:'09',title:'Проверка передаточного числа по высоте'},
{id:'10',title:'Проверка передаточного числа по угловой скорости'},
{id:'11',title:'Проверка передаточного числа по воздушной скорости'},
{id:'12',title:'Проверка передаточного числа по изодрому (ωᵧ)'}
];

const menu = document.getElementById('menu');
const frame = document.getElementById('frame');
const back = document.getElementById('back');

items.forEach((it,i)=>{
  const d=document.createElement('div');
  d.className='item';
  d.innerHTML=`<div class="num">${it.id}</div><div>${it.title}</div>`;
  d.onclick=()=>openItem(i);
  menu.appendChild(d);
});

function openItem(i){
  frame.src = `${BASE}p${items[i].id}.html`;
  back.style.display='block';
  [...menu.children].forEach(x=>x.classList.remove('active'));
  menu.children[i].classList.add('active');
}

back.onclick=()=>{
  frame.src='';
  back.style.display='none';
  [...menu.children].forEach(x=>x.classList.remove('active'));
};

/* УВЕЛИЧЕНИЕ ФОТО */
const modal=document.getElementById('modal');
document.querySelectorAll('.gallery img').forEach(img=>{
  img.onclick=()=>{
    modal.querySelector('img').src=img.src;
    modal.classList.add('active');
  };
});
modal.onclick=()=>modal.classList.remove('active');
</script>
</body>
</html>
