<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ВУАП-1 — Пункты 02–21</title>

  <style>
    :root{
      --bg1:#0b1a2a; --bg2:#153a5a;
      --card:rgba(255,255,255,.08);
      --stroke:rgba(255,255,255,.18);
      --text:#e9f2ff; --muted:#b7c7dd;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(255,255,255,.12), transparent 60%),
        radial-gradient(800px 500px at 85% 20%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
    }
    .wrap{max-width:1300px;margin:0 auto;padding:18px 14px 30px}
    .card{
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:14px;
      backdrop-filter:blur(6px);
      box-shadow:0 18px 40px rgba(0,0,0,.25);
    }
    h1{margin:0 0 6px;font-size:18px}
    .p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}

    /* УБРАНЫ ЧЁРНЫЕ КАССЕТЫ */
    .panels { display: none !important; }

    .hub{margin-top:12px;display:grid;grid-template-columns:380px 1fr;gap:12px}
    .menu{
      border:1px solid var(--stroke);
      border-radius:16px;
      padding:10px;
      background:rgba(0,0,0,.18);
      max-height:78vh; overflow:auto;
    }
    .item{
      display:flex; gap:10px; align-items:flex-start;
      padding:12px; border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.06);
      cursor:pointer; user-select:none;
      margin-bottom:10px;
    }
    .item:hover{background:rgba(255,255,255,.10)}
    .item.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28)}
    .num{
      min-width:44px; display:inline-flex; justify-content:center; align-items:center;
      padding:6px 10px; border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.22);
      font-weight:900;
    }
    .ttl{font-size:14px;font-weight:800;line-height:1.15}
    .sub{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-word}

    .viewer{
      border:1px solid var(--stroke);
      border-radius:16px;
      padding:10px;
      background:rgba(0,0,0,.12);
    }
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 6px 10px;flex-wrap:wrap}
    .title{font-weight:900;font-size:14px}
    iframe{
      width:100%; height:74vh;
      border:1px solid rgba(255,255,255,.18);
      border-radius:14px;
      background:rgba(0,0,0,.25);
    }
    .warn{
      margin-top:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px dashed rgba(255,255,255,.25);
      background:rgba(0,0,0,.18);
      color:var(--muted);
      font-size:12px;
      line-height:1.35;
    }

    .photosTitle{margin-top:14px;font-weight:900;font-size:14px}
    .gridPhotos{
      margin-top:10px;
      display:grid;
      gap:12px;
      grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    }
    .photoCard{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      overflow:hidden;
      margin:0;
    }
    .photoCard img{width:100%;height:220px;object-fit:cover;display:block}
    .cap{padding:10px 12px;font-size:14px;opacity:.9;white-space:pre-line}
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h1>ВУАП-1 · Пункты 02–21</h1>
    <p class="p" id="hintTop"></p>

    <div class="hub" id="hub">
      <div class="menu" id="menu"></div>

      <div class="viewer">
        <div class="top">
          <div class="title" id="title">Выбери пункт</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <a class="btn" id="openNew" href="#" target="_blank">Открыть отдельно</a>
            <button class="btn" type="button" onclick="reloadFrame()">Обновить</button>
          </div>
        </div>

        <iframe id="frame"></iframe>
        <div class="warn" id="warn"></div>
      </div>
    </div>

    <div class="photosTitle">Фото / подписи (CodePen)</div>
    <div class="gridPhotos">
      <figure class="photoCard"><img src="jpg1.jpg"><figcaption class="cap">а) пульт управления 6С2.390.125 ...</figcaption></figure>
      <figure class="photoCard"><img src="jpg2.jpg"><figcaption class="cap">Пульт управления 602.390.I26 ...</figcaption></figure>
      <figure class="photoCard"><img src="jpg3.jpg"><figcaption class="cap">БЛОК БСВ-24 ...</figcaption></figure>
      <figure class="photoCard"><img src="jpg4.jpg"><figcaption class="cap">Блок БВ-24 ...</figcaption></figure>
      <figure class="photoCard"><img src="jpg5.jpg"><figcaption class="cap">iX — по продольному перемещению</figcaption></figure>
      <figure class="photoCard"><img src="jpg6.jpg"><figcaption class="cap">MWx, MWz, γз, ϑз</figcaption></figure>
    </div>
  </div>
</div>

<script>
(function(){
  const path=(location.pathname||'').toLowerCase();
  window.BASE=path.includes('/vuap1/')?'./':'./vuap1/';
})();

const items=[
  {id:'02',title:'Проверка коэффициента усиления'},
  {id:'03',title:'Проверка крутизны датчика угла'},
  {id:'04',title:'Крутизна сигнала ОС'},
  {id:'05',title:'Скорость согласования'},
  {id:'06',title:'Передаточное число по углу'},
  {id:'07',title:'По барометрической высоте'},
  {id:'08',title:'По угловой скорости — направление'},
  {id:'09',title:'По угловой скорости — крен'},
  {id:'10',title:'По скорости изменения высоты'},
  {id:'11',title:'По угловой скорости — тангаж'},
  {id:'12',title:'По воздушной скорости'},
  {id:'13',title:'По КДТ'},
  {id:'14',title:'По КДК'},
  {id:'15',title:'Центровка БВ-24'},
  {id:'16',title:'Ограничения выходов'},
  {id:'17',title:'Составляющие путевой скорости'},
  {id:'18',title:'iX / iZ'},
  {id:'19',title:'Курс → крен'},
  {id:'20',title:'По геометрической высоте'},
  {id:'21',title:'Соотношение Vверт / H'}
];

const menu=document.getElementById('menu');
const frame=document.getElementById('frame');
const hintTop=document.getElementById('hintTop');

hintTop.innerHTML=`Открываются файлы <b>${BASE}p02.html … ${BASE}p21.html</b>`;

items.forEach(it=>{
  const d=document.createElement('div');
  d.className='item';
  d.innerHTML=`<span class="num">${it.id}</span> ${it.title}`;
  d.onclick=()=>frame.src=`${BASE}p${it.id}.html`;
  menu.appendChild(d);
});
</script>
</body>
</html>
