<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ВУАП-1 — Пункты 02–21</title>

  <style>
    :root{
      --bg1:#0b1a2a; --bg2:#153a5a;
      --card:rgba(255,255,255,.08);
      --stroke:rgba(255,255,255,.18);
      --text:#e9f2ff; --muted:#b7c7dd;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(255,255,255,.12), transparent 60%),
        radial-gradient(800px 500px at 85% 20%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
    }
    .wrap{max-width:1300px;margin:0 auto;padding:18px 14px 30px}
    .card{
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:14px;
      backdrop-filter:blur(6px);
      box-shadow:0 18px 40px rgba(0,0,0,.25);
    }
    h1{margin:0 0 6px;font-size:18px}
    .p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}

    .hub{margin-top:12px;display:grid;grid-template-columns:380px 1fr;gap:12px}
    .menu{
      border:1px solid var(--stroke);
      border-radius:16px;
      padding:10px;
      background:rgba(0,0,0,.18);
      max-height:78vh; overflow:auto;
    }
    .item{
      display:flex; gap:10px; align-items:flex-start;
      padding:12px; border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.06);
      cursor:pointer; user-select:none;
      margin-bottom:10px;
    }
    .item:hover{background:rgba(255,255,255,.10)}
    .item.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28)}
    .num{
      min-width:44px; display:inline-flex; justify-content:center; align-items:center;
      padding:6px 10px; border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.22);
      font-weight:900;
    }
    .ttl{font-size:14px;font-weight:800;line-height:1.15}
    .sub{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-word}

    .viewer{
      border:1px solid var(--stroke);
      border-radius:16px;
      padding:10px;
      background:rgba(0,0,0,.12);
    }
    iframe{
      width:100%; height:74vh;
      border:1px solid rgba(255,255,255,.18);
      border-radius:14px;
      background:rgba(0,0,0,.25);
    }

    .photosTitle{margin-top:14px;font-weight:900;font-size:14px}
    .gridPhotos{
      margin-top:10px;
      display:grid;
      gap:12px;
      grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    }
    .photoCard{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      overflow:hidden;
      margin:0;
    }
    .photoCard img{width:100%;height:220px;object-fit:cover;display:block}
    .cap{padding:10px 12px;font-size:14px;opacity:.9;white-space:pre-line}
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h1>ВУАП-1 · Пункты 02–21</h1>
    <p class="p" id="hintTop"></p>

    <div class="hub" id="hub">
      <div class="menu" id="menu"></div>

      <div class="viewer">
        <iframe id="frame"></iframe>
      </div>
    </div>

    <div class="photosTitle">Фото / подписи (CodePen)</div>
    <div class="gridPhotos">
      <figure class="photoCard"><img src="jpg1.jpg"><figcaption class="cap">...</figcaption></figure>
      <figure class="photoCard"><img src="jpg2.jpg"><figcaption class="cap">...</figcaption></figure>
      <figure class="photoCard"><img src="jpg3.jpg"><figcaption class="cap">...</figcaption></figure>
      <figure class="photoCard"><img src="jpg4.jpg"><figcaption class="cap">...</figcaption></figure>
      <figure class="photoCard"><img src="jpg5.jpg"><figcaption class="cap">...</figcaption></figure>
      <figure class="photoCard"><img src="jpg6.jpg"><figcaption class="cap">...</figcaption></figure>
    </div>
  </div>
</div>

<script>
(function(){
  const path=(location.pathname||'').toLowerCase();
  window.BASE=path.includes('/vuap1/')?'./':'./vuap1/';
})();

const items=[
  {id:'02',title:'Проверка коэфициента усиления'},
  {id:'03',title:'Проверка крутизны датчика угла'},
  {id:'04',title:'Проверка крутизны сигнала в цепи обратной связи (ОС)'},
  {id:'05',title:'Проверка скорости согласования'},
  {id:'06',title:'Проверка передаточного числа по углу'},
  {id:'07',title:'Проверка передаточного числа по барометрической высоте'},
  {id:'08',title:'Передаточное число по угловой скорости — направление'},
  {id:'09',title:'Передаточное число по угловой скорости — крен'},
  {id:'10',title:'Передаточное число по скорости изменения высоты'},
  {id:'11',title:'Передаточное число по угловой скорости — тангаж'},
  {id:'12',title:'Передаточное число по воздушной скорости'},
  {id:'13',title:'Передаточное число по КДТ'},
  {id:'14',title:'Передаточное число по КДК'},
  {id:'15',title:'Центровка выходов усилителей БВ-24'},
  {id:'16',title:'Проверка ограничений выходных сигналов'},
  {id:'17',title:'Передаточные числа по составляющим путевой скорости'},
  {id:'18',title:'Проверка и регулировка передаточных чисел по перемещению'},
  {id:'19',title:'Передаточное число по сигналу курса в канал крена'},
  {id:'20',title:'Передаточное число по геометрической высоте'},
  {id:'21',title:'Проверка коэффициента соотношения'}
];

const menu=document.getElementById('menu');
const frame=document.getElementById('frame');
const hintTop=document.getElementById('hintTop');

hintTop.innerHTML=`Открываются файлы <b>${BASE}p02.html … ${BASE}p21.html</b>`;

function build(){
  menu.innerHTML='';
  items.forEach((it,i)=>{
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`<span class="num">${it.id}</span>
      <div><div class="ttl">${it.title}</div></div>`;
    d.onclick=()=>open(i);
    menu.appendChild(d);
  });
}

function open(i){
  frame.src=`${BASE}p${items[i].id}.html`;
}

build();
</script>
</body>
</html>
