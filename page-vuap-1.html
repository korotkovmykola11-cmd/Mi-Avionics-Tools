<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ВУАП-1 — Пункты 02–21</title>

  <style>
    :root{
      --bg1:#0b1a2a; --bg2:#153a5a;
      --card:rgba(255,255,255,.08);
      --stroke:rgba(255,255,255,.18);
      --text:#e9f2ff; --muted:#b7c7dd;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(255,255,255,.12), transparent 60%),
        radial-gradient(800px 500px at 85% 20%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
    }
    .wrap{max-width:1300px;margin:0 auto;padding:18px 14px 30px}
    .card{
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:14px;
      backdrop-filter:blur(6px);
      box-shadow:0 18px 40px rgba(0,0,0,.25);
    }
    h1{margin:0 0 6px;font-size:18px}
    .p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}

    .hub{margin-top:12px;display:grid;grid-template-columns:380px 1fr;gap:12px}
    .menu{
      border:1px solid var(--stroke);
      border-radius:16px;
      padding:10px;
      background:rgba(0,0,0,.18);
      max-height:78vh; overflow:auto;
    }
    .item{
      display:flex; gap:10px; align-items:flex-start;
      padding:12px; border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.06);
      cursor:pointer;
      margin-bottom:10px;
    }
    .item.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28)}
    .num{
      min-width:44px; display:inline-flex; justify-content:center; align-items:center;
      padding:6px 10px; border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.22);
      font-weight:900;
    }

    .viewer{
      border:1px solid var(--stroke);
      border-radius:16px;
      padding:10px;
      background:rgba(0,0,0,.12);
    }

    iframe{
      width:100%; height:74vh;
      border:1px solid rgba(255,255,255,.18);
      border-radius:14px;
      background:rgba(0,0,0,.25);
    }

    .photosTitle{margin-top:14px;font-weight:900;font-size:14px}
    .gridPhotos{
      margin-top:10px;
      display:grid;
      gap:12px;
      grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    }
    .photoCard{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      overflow:hidden;
    }
    .photoCard img{width:100%;height:220px;object-fit:cover;display:block}
    .cap{padding:10px 12px;font-size:14px;opacity:.9;white-space:pre-line}
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h1>ВУАП-1 · Пункты 02–21</h1>

    <div class="hub">
      <div class="menu" id="menu"></div>

      <div class="viewer">
        <iframe id="frame"></iframe>
      </div>
    </div>

    <div class="photosTitle">Фото / подписи</div>
    <div class="gridPhotos">

      <figure class="photoCard">
        <img src="./jpg1.jpg" alt="">
        <figcaption class="cap">а) пульт управления 6С2.390.125

индикатор нулевой, кнопки-табло "ВКЛ" и "ОТКЛ"
— центрирование канала, проверка коэффициента усиления усилителя сервопривода и крутизны выпрямленного сигнала угла; включение и отключение канала автопилота;

индикатор нулевой
— проверка: крутизны сигнала в цепи обратной связи, передаточных чисел по углу и угловой скорости, передаточного числа от ручки летчика к датчику компенсационного тангажа, передаточного числа по КДК; индикация положения штока малого цилиндра рулевого агрегата;

ручка центровки
— запаса контрольных сигналов на вход канала;

регулировочные потенциометры:
"УГОЛ" — регулировка передаточного числа по углу в каналах направления, крена и тангажа;
"СК"   — регулировка передаточного числа по угловой скорости в каналах направления, крена и тангажа;
"ДК"   — регулировка передаточного числа датчика компенсационного крена в канале крена, регулировка передаточного числа по воздушной скорости в канале тангажа,в канале направления не задействован;
"ЦЕНТР"— центрирование каналов;
"ИН"   — регулировка крутизны сигналов с датчика обратной связи;
"КР"   — регулировка крутизны сигнала с датчика угла;</figcaption>
      </figure>

      <figure class="photoCard">
        <img src="./jpg2.jpg" alt="">
        <figcaption class="cap"> Пульт управления 6С2.390.I26:
Индикатор нулевой, кнопки-табло «ВКЛ» и «ОТКЛ» – центрирование канала и проверка коэффициента усиления усилителя сервопривода, включение и отключение канала автопилота.
Индикатор нулевой – проверка крутильных сигналов в цепи обратной связи, передаточных чисел по высоте и по скорости изменения высоты, индикация положения штока малого цилиндра рулевого агрегата.
Тумблер «Контроль» – задание контрольного сигнала на вход канала высоты.
Регулировочные потенциометры:
«ВЫС» – регулировка передаточного числа по высоте;
«СК» – регулировка передаточного числа по скорости изменения высоты;
«ЦЕНТР» – центрирование канала;
«ИН» – регулировка крутильных сигналов с датчика обратной связи.</figcaption>
      </figure>

      <figure class="photoCard">
        <img src="./jpg3.jpg" alt="">
        <figcaption class="cap">БЛОК БСВ-24 : iWy — регулировка передаточного числа по вертикальной составляющей путевой скорости
iΔH — регулировка передаточного числа по геометрической высоте
МНрв — регулировка крутизны сигнала Нрв</figcaption>
      </figure>

      <figure class="photoCard">
        <img src="./jpg4.jpg" alt="">
        <figcaption class="cap">Блок БВ-24. Обозначения режимов регулировки передаточного числа:

iZ  — по боковому перемещению;  
iWx — по продольной составляющей путевой скорости;  
iWz — по боковой составляющей путевой скорости;  
iYΔψ — по углу курса в канале крена;
R38 — для сигнала Z (боковое перемещение);
R39 — для сигнала Yз (γзад, регулировка крутизны выходного сигнала заданного угла крена);
R40 — для сигнала X (продольное перемещение);
R41 — для сигнала ϑз(ϑзад, регулировка крутизны выходного сигнала заданного угла тангажа).</figcaption>
      </figure>

      <figure class="photoCard">
        <img src="./jpg5.jpg" alt="">
        <figcaption class="cap">Блок БВ-24. Обозначения режимов регулировки передаточного числа: iX  — по продольному перемещению</figcaption>
      </figure>

      <figure class="photoCard">
        <img src="./jpg6.jpg" alt="">
        <figcaption class="cap">Блок БВ-24. Обозначения режимов регулировки передаточного числа (сверху блока):
MWx — регулировка крутизны сигнала Wx;
MWz — регулировка крутизны сигнала Wz;
γз- регулировка крутизны выходного сигнала заданного угла крена;
ϑз-регулировка крутизны выходного сигнала заданного угла крена;</figcaption>
      </figure>

    </div>
  </div>
</div>

<script>
const BASE = './vuap1/';

const items=[
  {id:'01',title:'Положение потенциометров ВУАП-1'},
  {id:'02',title:'Проверка коэфициента усиления'},
  {id:'03',title:'Проверка крутизны датчика угла'},
  {id:'04',title:'Проверка крутизны сигнала в цепи обратной связи (ОС)'},
  {id:'05',title:'Проверка скорости согласования'},
  {id:'06',title:'Проверка передаточного числа по углу'},
  {id:'07',title:'Проверка передаточного числа по барометрической высоте'},
  {id:'08',title:'Передаточное число по угловой скорости — направление'},
  {id:'09',title:'Передаточное число по угловой скорости — крен'},
  {id:'10',title:'Передаточное число по скорости изменения высоты'},
  {id:'11',title:'Передаточное число по угловой скорости — тангаж'},
  {id:'12',title:'Передаточное число по воздушной скорости'},
  {id:'13',title:'Передаточное число по КДТ'},
  {id:'14',title:'Передаточное число по КДК'},
  {id:'15',title:'Центровка выходов усилителей БВ-24'},
  {id:'16',title:'Проверка ограничений выходных сигналов'},
  {id:'17',title:'Передаточные числа по составляющим путевой скорости'},
  {id:'18',title:'Проверка и регулировка передаточных чисел по перемещению'},
  {id:'19',title:'Передаточное число по сигналу курса в канал крена'},
  {id:'20',title:'Передаточное число по геометрической высоте'},
  {id:'21',title:'Проверка коэффициента соотношения'}
];

const menu=document.getElementById('menu');
const frame=document.getElementById('frame');

function build(){
  items.forEach((it,i)=>{
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`<span class="num">${it.id}</span><div>${it.title}</div>`;
    d.onclick=()=>open(i);
    menu.appendChild(d);
  });
}

function open(i){
  const url = `${BASE}p${items[i].id}.html`;

  if (window.innerWidth < 900) {
    window.location.href = url;   // ← мобильный
  } else {
    frame.src = url;             // ← ПК
  }

  document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));
  menu.children[i].classList.add('active');
}


build();
</script>
</body>
</html>
