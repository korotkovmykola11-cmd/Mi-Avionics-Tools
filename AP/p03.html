<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АП-34Б · Пункт 03 · Проверка остаточного сигнала</title>

<style>
:root{
  --bg:#060d18;
  --card:#0f1e33;
  --stroke:#27446b;
  --text:#e6eefc;
  --muted:#8aa2c2;

  --ok:#00e5ff;
  --bad:#ff4d4d;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(800px 400px at 50% 10%,#123,#060d18);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
}

.wrap{max-width:1100px;margin:auto;padding:20px}
.card{
  background:rgba(15,30,51,.9);
  border:1px solid var(--stroke);
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
}

h1{margin:0 0 4px;font-size:20px}
h2{margin:14px 0 8px;font-size:15px}
.p{font-size:13px;color:var(--muted)}

textarea{
  width:100%;
  min-height:280px;
  background:#050b15;
  color:var(--text);
  border:1px dashed #345;
  border-radius:12px;
  padding:14px;
  font-family:JetBrains Mono,monospace;
  font-size:13px;
  line-height:1.6;
}

/* ===== TABLE ===== */
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #234;font-size:13px}
input{
  width:80px;
  background:#050b15;
  color:#fff;
  border:1px solid #345;
  border-radius:6px;
  padding:4px 6px;
}
.pass{color:#00ff9c;font-weight:700}
.fail{color:#ff4d4d;font-weight:700}

/* ===== SCHEME ===== */
.scheme{
  margin-top:14px;
  background:#020814;
  border:1px solid #234;
  border-radius:14px;
  padding:24px;
  position:relative;
}

.node{
  position:absolute;
  width:220px;
  padding:14px;
  border-radius:14px;
  border:2px solid var(--ok);
  text-align:center;
  background:#0b1a30;
  transition:.3s;
}

.node.fail{border-color:var(--bad)}

#pult{left:20px;top:90px}
#au{right:20px;top:40px}

.node-title{font-weight:800;font-size:13px}
.node-code{font-size:12px;color:var(--muted)}

.connector{
  display:inline-block;
  margin:4px;
  padding:2px 8px;
  font-size:11px;
  border-radius:6px;
  background:#102a4a;
  border:1px solid #345;
}

.cable{
  position:absolute;
  height:4px;
  background:linear-gradient(90deg,transparent,var(--ok),transparent);
  animation:flow 2s linear infinite;
}

.cable.fail{
  background:linear-gradient(90deg,transparent,var(--bad),transparent);
}

#k{left:260px;top:130px;width:520px}
#ra{left:260px;top:160px;width:520px}

#au-down{
  left:calc(100% - 130px);
  top:210px;
  width:4px;
  height:120px;
  animation:flowV 2s linear infinite;
}

@keyframes flow{
  from{background-position:0}
  to{background-position:200px}
}
@keyframes flowV{
  from{background-position:0}
  to{background-position:0 200px}
}

.footer-note{
  margin-top:12px;
  font-size:12px;
  color:#ffd36a;
}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h1>АП-34Б · Пункт 03</h1>
<p class="p">Проверка остаточного сигнала</p>

<textarea>
Отсоединить от агрегата управления разъём "РА".
Пульт 6С2.702.007 соединить с агрегатом управления с помощью жгутов "К" и "РА" (см. схему ниже).

Переключатели и ручки на пульте 6С2.702.007 установить:
"2" — в среднее положение;
"5" — в нулевое положение по вольтметру В1;
"8" — в положение проверяемого канала;
"9" — "ост. сигнал";
"10" — "У";
"11" — "ОТКЛ.";
"12" — "КОМПЛЕКТ";
"13" — "0".

Устанавливая переключатель "8" в положение проверяемого канала, замечать показания вольтметра "3" пульта,
которые должны быть не более 10 В для всех каналов.
Если в каком-либо канале показания вольтметра "3" не укладываются в допуск,
необходимо произвести регулировку ручкой "ЦЕНТРОВКА" агрегата управления соответствующего канала.

ПРИМЕЧАНИЕ. Нулевым положением задатчика "5" считается положение,
соответствующее минимальному сигналу по вольтметру "1".
</textarea>
</div>

<div class="card">
<h2>Контроль напряжений</h2>
<table>
<tr><th>Канал</th><th>В</th><th>Результат</th></tr>
<tr><td>Направление</td><td><input oninput="chk(this)"></td><td class="res"></td></tr>
<tr><td>Крен</td><td><input oninput="chk(this)"></td><td class="res"></td></tr>
<tr><td>Тангаж</td><td><input oninput="chk(this)"></td><td class="res"></td></tr>
<tr><td>Высота</td><td><input oninput="chk(this)"></td><td class="res"></td></tr>
</table>
</div>

<div class="card">
<h2>Схема подключения</h2>
<div class="scheme" id="scheme">

  <div class="node" id="pult">
    <div class="node-title">ПУЛЬТ</div>
    <div class="node-code">6С2.702.007</div>
    <div class="connector">К</div>
    <div class="connector">РА</div>
  </div>

  <div class="node" id="au">
    <div class="node-title">АГРЕГАТ УПРАВЛЕНИЯ</div>
    <div class="node-code">6С2.399.000</div>
    <div class="connector">АУ</div>
    <div class="connector">К</div>
    <div class="connector">РА</div>
  </div>

  <div class="cable" id="k"></div>
  <div class="cable" id="ra"></div>
  <div class="cable" id="au-down"></div>

</div>

<div class="footer-note">
Жгут «АУ» → к фидерной схеме вертолёта
</div>
</div>

</div>

<script>
function chk(el){
  const v=parseFloat(el.value);
  const r=el.parentElement.nextElementSibling;
  if(isNaN(v)){r.textContent='';return}

  if(v<=10){
    r.textContent='PASS';
    r.className='res pass';
  }else{
    r.textContent='FAIL';
    r.className='res fail';
  }
  updateScheme();
}

function updateScheme(){
  const fails=document.querySelectorAll('.fail').length>0;
  document.querySelectorAll('.node,.cable').forEach(e=>{
    e.classList.toggle('fail',fails);
  });
}
</script>

</body>
</html>
