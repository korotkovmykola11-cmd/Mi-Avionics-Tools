<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>АП-34Б · Пункт 03 · Проверка остаточного сигнала</title>

<style>
:root{
  --bg1:#0b1a2a;
  --bg2:#153a5a;
  --card:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.18);
  --text:#e9f2ff;
  --muted:#b7c7dd;
  --ok:#39d98a;
  --bad:#ff5c5c;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 15% 10%, rgba(255,255,255,.12), transparent 60%),
    radial-gradient(800px 500px at 85% 20%, rgba(255,255,255,.10), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
}

.wrap{max-width:1200px;margin:auto;padding:16px}

.card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:18px;
  padding:16px;
  backdrop-filter:blur(6px);
  box-shadow:0 18px 40px rgba(0,0,0,.25);
}

h1{margin:0;font-size:18px}
h2{margin:18px 0 8px;font-size:15px}
.p{margin:4px 0;color:var(--muted);font-size:13px}

.back{
  display:inline-block;
  margin-bottom:10px;
  padding:6px 12px;
  border-radius:10px;
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.08);
  color:var(--text);
  text-decoration:none;
  font-size:13px;
}

textarea{
  width:100%;
  min-height:280px;
  padding:12px;
  border-radius:14px;
  border:1px dashed rgba(255,255,255,.25);
  background:rgba(0,0,0,.25);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  resize:vertical;
}

/* ===== КАЛЬКУЛЯТОР ===== */

.table{
  display:grid;
  grid-template-columns:1fr 120px 120px;
  gap:6px;
  margin-top:10px;
}

.cell{
  padding:8px;
  border-radius:8px;
  border:1px solid var(--stroke);
  background:rgba(0,0,0,.25);
  font-size:13px;
}

.cell input{
  width:100%;
  background:none;
  border:none;
  color:var(--text);
  font-size:14px;
  outline:none;
}

.pass{color:var(--ok);font-weight:700}
.fail{color:var(--bad);font-weight:700}

/* ===== СХЕМА ===== */

.scheme-wrap{
  margin-top:16px;
  border:1px solid var(--stroke);
  border-radius:14px;
  background:
    linear-gradient(transparent 19px, rgba(255,255,255,.05) 20px),
    linear-gradient(90deg, transparent 19px, rgba(255,255,255,.05) 20px);
  background-size:20px 20px;
  padding:16px;
  overflow:auto;
}

.scheme{
  display:grid;
  grid-template-columns:240px 1fr 240px;
  align-items:center;
  min-width:720px;
  gap:20px;
}

.box{
  border:2px solid #e9f2ff;
  border-radius:14px;
  padding:12px;
  text-align:center;
}

.line{
  position:relative;
  height:4px;
  background:#e9f2ff;
  border-radius:2px;
}

.line::after{
  content:attr(data-label);
  position:absolute;
  top:-20px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}

.down{
  height:40px;
  width:4px;
  margin:8px auto 0;
  background:#e9f2ff;
}

@media(max-width:800px){
  .scheme{grid-template-columns:1fr}
  .line{display:none}
}
</style>
</head>

<body>
<div class="wrap">
<div class="card">

<a class="back" href="../page-ap34b.html">← Назад</a>

<h1>АП-34Б · Пункт 03</h1>
<p class="p">Проверка остаточного сигнала</p>

<h2>Текст проверки</h2>

<textarea>
Отсоединить от агрегата управления разъём "РА".
Пульт 6С2.702.007 соединить с агрегатом управления с помощью жгутов "К" и "РА" (см. схему ниже).

Переключатели и ручки на пульте 6С2.702.007 установить:
"2" — в среднее положение;
"5" — в нулевое положение по вольтметру В1;
"8" — в положение проверяемого канала;
"9" — "ост. сигнал";
"10" — "У";
"11" — "ОТКЛ.";
"12" — "КОМПЛЕКТ";
"13" — "0".

Устанавливая переключатель "8" в положение проверяемого канала, замечать показания вольтметра "3" пульта,
которые должны быть не более 10 В для всех каналов.
Если в каком-либо канале показания вольтметра "3" не укладываются в допуск,
необходимо произвести регулировку ручкой "ЦЕНТРОВКА" агрегата управления соответствующего канала.

ПРИМЕЧАНИЕ. Нулевым положением задатчика "5" считается положение,
соответствующее минимальному сигналу по вольтметру "1".
</textarea>

<h2>Контроль напряжений</h2>

<div class="table">
  <div class="cell">Канал</div>
  <div class="cell">Напряжение, В</div>
  <div class="cell">Результат</div>

  <div class="cell">Направление</div>
  <div class="cell"><input oninput="chk(this,'r1')"></div>
  <div class="cell" id="r1"></div>

  <div class="cell">Крен</div>
  <div class="cell"><input oninput="chk(this,'r2')"></div>
  <div class="cell" id="r2"></div>

  <div class="cell">Тангаж</div>
  <div class="cell"><input oninput="chk(this,'r3')"></div>
  <div class="cell" id="r3"></div>

  <div class="cell">Высота</div>
  <div class="cell"><input oninput="chk(this,'r4')"></div>
  <div class="cell" id="r4"></div>
</div>

<h2>Схема подключения</h2>

<div class="scheme-wrap">
  <div class="scheme">

    <div class="box">
      <b>ПУЛЬТ</b><br>
      6С2.702.007<br><br>
      «К»<br>
      «РА»
    </div>

    <div>
      <div class="line" data-label='Жгут "К" 6С6.640.043'></div>
      <div style="height:16px"></div>
      <div class="line" data-label='Жгут "РА" 6С6.640.044'></div>
    </div>

    <div class="box">
      <b>АГРЕГАТ УПРАВЛЕНИЯ</b><br>
      6С2.399.000<br><br>
      «АУ» · «К» · «РА»
      <div class="down"></div>
      <div class="p">Жгут «АУ» → к фидерной схеме вертолёта</div>
    </div>

  </div>
</div>

</div>
</div>

<script>
function chk(el,id){
  const v=parseFloat(el.value);
  const r=document.getElementById(id);
  if(isNaN(v)){r.textContent='';return}
  if(v<=10){
    r.textContent='PASS';
    r.className='cell pass';
  }else{
    r.textContent='FAIL';
    r.className='cell fail';
  }
}
</script>

</body>
</html>
