<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АП-34Б · Пункт 03 · Проверка остаточного сигнала</title>

<style>
:root{
  --bg1:#0b1a2a;
  --bg2:#153a5a;
  --card:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.18);
  --text:#e9f2ff;
  --muted:#b7c7dd;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 15% 10%, rgba(255,255,255,.12), transparent 60%),
    radial-gradient(800px 500px at 85% 20%, rgba(255,255,255,.10), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:18px;
  padding:16px;
  box-shadow:0 18px 40px rgba(0,0,0,.25);
}

h1{margin:0 0 4px;font-size:18px}
h2{margin:18px 0 10px;font-size:15px}
p{margin:0 0 8px;color:var(--muted)}

.text{
  white-space:pre-line;
  font-size:14px;
  padding:12px;
  border:1px dashed rgba(255,255,255,.25);
  border-radius:12px;
}

/* СХЕМА */
.scheme{
  margin-top:12px;
  padding:12px;
  border:1px solid var(--stroke);
  border-radius:14px;
  background:rgba(0,0,0,.18);
}
svg{
  width:100%;
  height:auto;
}
.label{
  fill:#e9f2ff;
  font-size:13px;
  font-family:monospace;
}
.box{
  fill:rgba(255,255,255,.08);
  stroke:#e9f2ff;
  stroke-width:1;
}
.line{
  stroke:#e9f2ff;
  stroke-width:2;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">

    <h1>АП-34Б · Пункт 03</h1>
    <p>Проверка остаточного сигнала</p>

    <!-- ТЕКСТ ТЫ ПИШЕШЬ САМ -->
    <div class="text">
(сюда ты вставляешь текст из РЛЭ
как в оригинале: пункты, переносы, примечания)
    </div>

    <h2>Схема подключения</h2>

    <!-- СХЕМА В SVG -->
    <div class="scheme">
<svg viewBox="0 0 900 360">

  <!-- ПУЛЬТ -->
  <rect x="40" y="140" width="240" height="110" rx="10" class="box"/>
  <text x="160" y="165" text-anchor="middle" class="label">ПУЛЬТ</text>
  <text x="160" y="185" text-anchor="middle" class="label">6С2.702.007</text>
  <text x="60" y="215" class="label">«К»</text>
  <text x="60" y="235" class="label">«РА»</text>

  <!-- АГРЕГАТ -->
  <rect x="600" y="120" width="260" height="140" rx="10" class="box"/>
  <text x="730" y="155" text-anchor="middle" class="label">АГРЕГАТ УПРАВЛЕНИЯ</text>
  <text x="730" y="175" text-anchor="middle" class="label">6С2.399.000</text>
  <text x="620" y="215" class="label">«АУ»</text>
  <text x="720" y="215" class="label">«К»</text>
  <text x="820" y="215" class="label">«РА»</text>

  <!-- ЖГУТЫ -->
  <line x1="280" y1="215" x2="600" y2="215" class="line"/>
  <text x="390" y="200" class="label">Жгут «К»</text>

  <line x1="280" y1="235" x2="600" y2="255" class="line"/>
  <text x="390" y="255" class="label">Жгут «РА»</text>

  <!-- ПОДПИСЬ -->
  <text x="450" y="330" text-anchor="middle" class="label">
    К фидерной схеме вертолёта
  </text>

</svg>
    </div>

  </div>
</div>
</body>
</html>
