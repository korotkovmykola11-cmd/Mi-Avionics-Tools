<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Технологическая карта — редактируемая</title>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:#0b1626;
  color:#eaf6ff;
}
header{
  padding:14px;
  background:#07101c;
  border-bottom:1px solid #1e2b44;
}
h1{margin:0;font-size:18px;color:#21f0ff}
p{margin:6px 0 0;font-size:13px;color:#9fb3cc}

.controls{
  padding:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
button{
  padding:10px 14px;
  font-weight:700;
  border-radius:10px;
  border:1px solid #2c3f66;
  background:#122036;
  color:#eaf6ff;
  cursor:pointer;
}
button:hover{border-color:#21f0ff}

.table{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.row{
  border:1px solid #2c3f66;
  border-radius:12px;
  overflow:hidden;
  background:#0f1d33;
}
.row-header{
  padding:6px 10px;
  background:#0a1628;
  font-weight:800;
  color:#00ffa6;
  display:flex;
  justify-content:space-between;
}
.cells{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
}
.cell{
  border-right:1px solid #2c3f66;
  padding:8px;
}
.cell:last-child{border-right:none}

.box{
  width:100%;
  min-height:100px;
  background:#07101c;
  border:1px solid #2c3f66;
  border-radius:8px;
  padding:8px;
  color:#eaf6ff;
  font-size:14px;
  line-height:1.4;
  white-space:pre-wrap;
  outline:none;
}
.box:focus{border-color:#21f0ff}

@media(max-width:900px){
  .cells{grid-template-columns:1fr}
  .cell{border-right:none;border-bottom:1px solid #2c3f66}
  .cell:last-child{border-bottom:none}
}
</style>
</head>

<body>

<header>
  <h1>Технологическая карта</h1>
  <p>Редактируй пункты прямо здесь. Сохраняется локально или в HTML.</p>
</header>

<div class="controls">
  <button onclick="addRow()">+ Добавить пункт</button>
  <button onclick="saveLocal()">💾 Сохранить</button>
  <button onclick="loadLocal()">📥 Загрузить</button>
  <button onclick="downloadHTML()">⬇️ Скачать HTML</button>
</div>

<div class="table" id="table"></div>

<script>
const STORAGE_KEY="TECHCARD_DATA";

let items=[];

function render(){
  const t=document.getElementById("table");
  t.innerHTML="";
  items.forEach((it,i)=>{
    const r=document.createElement("div");
    r.className="row";

    const h=document.createElement("div");
    h.className="row-header";
    h.innerHTML=`Пункт ${i+1} <span style="cursor:pointer" onclick="removeRow(${i})">✕</span>`;

    const c=document.createElement("div");
    c.className="cells";

    ["op","tt","dev"].forEach(k=>{
      const d=document.createElement("div");
      d.className="cell";
      const b=document.createElement("div");
      b.className="box";
      b.contentEditable=true;
      b.innerText=it[k]||"";
      b.oninput=()=>{items[i][k]=b.innerText};
      d.appendChild(b);
      c.appendChild(d);
    });

    r.append(h,c);
    t.appendChild(r);
  });
}

function addRow(){
  items.push({op:"",tt:"",dev:""});
  render();
}

function removeRow(i){
  if(!confirm("Удалить пункт "+(i+1)+"?"))return;
  items.splice(i,1);
  render();
}

function saveLocal(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(items));
  alert("Сохранено");
}

function loadLocal(){
  const d=localStorage.getItem(STORAGE_KEY);
  if(!d){alert("Нет сохранённых данных");return}
  items=JSON.parse(d);
  render();
}

function downloadHTML(){
  const html=document.documentElement.outerHTML.replace(
    /let items=\[[\s\S]*?\];/,
    "let items="+JSON.stringify(items,null,2)+";"
  );
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download="techcard_saved.html";
  a.click();
}

(function init(){
  const d=localStorage.getItem(STORAGE_KEY);
  if(d){items=JSON.parse(d)}
  else items=[{op:"",tt:"",dev:""}];
  render();
})();
</script>

</body>
</html>
