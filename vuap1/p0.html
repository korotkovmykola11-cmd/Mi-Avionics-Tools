<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Технологическая карта — p0</title>
  <style>
    :root{
      --bg1:#061a2e; --bg2:#0b2943; --bg3:#03110a;
      --glass: rgba(10,18,28,.72);
      --glass2: rgba(8,14,22,.62);
      --line: rgba(255,255,255,.10);

      --ink:#eaf6ff;
      --muted:#b9cadd;
      --accent:#21f0ff;
      --accent2:#00ffa6;

      --r:16px;
      --font: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;

      /* фикс ширины колонок (строго напротив) */
      --colOp: 560px;
      --colTT: 420px;
      --colDev: 420px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);color:var(--ink)}
    .scene{
      min-height:100vh;
      padding:14px;
      background:
        radial-gradient(900px 520px at 25% 18%, rgba(120,190,255,.40), transparent 62%),
        radial-gradient(900px 520px at 78% 22%, rgba(50,140,255,.30), transparent 62%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, #061523 78%, var(--bg3) 100%);
    }
    .doc{
      max-width: 1420px;
      margin:0 auto;
      border-radius: var(--r);
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      border:1px solid var(--line);
      box-shadow: 0 30px 90px rgba(0,0,0,.62), 0 0 0 1px rgba(33,240,255,.10) inset;
      backdrop-filter: blur(8px);
      overflow:hidden;
    }
    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      background: rgba(0,0,0,.12);
    }
    .title{
      font-weight:950;
      letter-spacing:.6px;
      color: var(--accent);
      font-size: 18px;
    }
    .subtitle{
      margin-top:6px;
      color: var(--muted);
      font-size: 13px;
      max-width: 760px;
      line-height:1.3;
    }
    .btns{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
    .btn{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--ink);
      padding:8px 10px;
      border-radius:12px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
    }
    .btn:hover{border-color: rgba(33,240,255,.28)}
    .btn.primary{
      border-color: rgba(0,255,166,.28);
      box-shadow: 0 0 18px rgba(0,255,166,.10);
    }
    .wrap{
      padding:12px;
      overflow:auto;
      max-height: calc(100vh - 130px);
      -webkit-overflow-scrolling: touch;
    }

    /* Табличный режим: всегда 3 колонки, на телефоне — горизонтальная прокрутка */
    .grid{
      min-width: calc(var(--colOp) + var(--colTT) + var(--colDev) + 40px);
      border:1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      overflow:hidden;
      background: rgba(0,0,0,.08);
    }
    .head{
      display:grid;
      grid-template-columns: var(--colOp) var(--colTT) var(--colDev);
      position: sticky;
      top:0;
      z-index:5;
      background: rgba(6,14,22,.92);
      border-bottom:1px solid rgba(255,255,255,.12);
    }
    .hcell{
      padding:12px;
      border-right:1px solid rgba(255,255,255,.08);
      font-weight:950;
    }
    .hcell:last-child{border-right:none}

    .rows{display:flex; flex-direction:column; gap:10px; padding:10px}

    .wrapRow{
      border-radius:12px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.06);
    }
    .rowTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:8px 10px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.10);
    }
    .tag{
      font-weight:950;
      color: var(--accent2);
      padding:5px 10px;
      border-radius: 999px;
      border:1px solid rgba(0,255,166,.22);
      background: rgba(0,0,0,.12);
    }
    .mini{
      padding:6px 10px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color:#dff7ff;
      cursor:pointer;
      font-weight:900;
    }

    .row{
      display:grid;
      grid-template-columns: var(--colOp) var(--colTT) var(--colDev);
    }
    .cell{
      padding:10px;
      border-right:1px solid rgba(255,255,255,.08);
      background: rgba(7,14,22,.30);
    }
    .cell:last-child{border-right:none}

    .box{
      min-height: 120px;
      border-radius: 10px;
      border:1px solid rgba(33,240,255,.12);
      background: rgba(7,14,22,.35);
      padding: 10px 12px;
      outline:none;

      white-space: pre-wrap;
      word-break: normal;
      overflow-wrap: break-word;
      hyphens: auto;

      font-size: 14px;
      line-height: 1.35;
      color: #eaf6ff;
      overflow:auto;
    }
    .box:focus{
      border-color: rgba(33,240,255,.35);
      box-shadow: 0 0 0 1px rgba(0,0,0,.30) inset, 0 0 24px rgba(33,240,255,.10);
    }
    .box:empty::before{
      content: attr(data-ph);
      color: rgba(185,202,221,.55);
    }

    .modeNote{
      color:var(--muted);
      font-size:12px;
      padding:10px 14px;
      border-top:1px solid var(--line);
      background: rgba(0,0,0,.12);
    }

    /* скрытый блок со стартовыми текстами */
    .seed{display:none}

    @media print{
      .scene{padding:0; background:#fff}
      .doc{box-shadow:none; border:none; background:#fff; color:#000}
      header,.modeNote{display:none}
      .wrap{max-height:none; overflow:visible; padding:0}
      .grid{border:1px solid #ccc; background:#fff}
      .head{position:static; background:#fff}
      .cell,.box{background:#fff; color:#000}
      .box{border:1px solid #ccc}
      .mini{display:none}
      .tag{color:#000; border:1px solid #ddd; background:#fff}
    }
  </style>
</head>

<body>
<div class="scene">
  <div class="doc">
    <header>
      <div>
        <div class="title">Технологическая карта — p0</div>
        <div class="subtitle">
          Таблица всегда из 3 колонок (строго напротив). На телефоне просто листай вбок (горизонтальная прокрутка) — так сохраняется “линейность”.
        </div>
      </div>
      <div class="btns">
        <button class="btn primary" id="addRow">+ Добавить пункт</button>
        <button class="btn" id="saveHtml">Сохранить копию (HTML)</button>
        <button class="btn" id="print">Печать</button>
      </div>
    </header>

    <div class="wrap">
      <div class="grid">
        <div class="head">
          <div class="hcell">Содержание операции</div>
          <div class="hcell">Технические требования (ТТ)</div>
          <div class="hcell">Работы при отклонениях от ТТ</div>
        </div>
        <div class="rows" id="rows"></div>
      </div>
    </div>

    <div class="modeNote" id="modeNote"></div>

    <!-- ======================================================
         СТАРТОВЫЕ ДАННЫЕ (ВСТАВЛЯЕШЬ ТЕКСТ СЮДА)
         ====================================================== -->
    <div class="seed">
      <textarea id="seed_op">
Проверьте работоспособность системы ав-томатического управления САУ-В24-1. для чего:

- установите автомат защиты "САУ СИГ-НАЛ" на левом пульте АЗС в положение "ВКЛЮЧЕНО";

















- включите системы и агрегаты взаимодей-ствия с САУ, гировертикаль МГВ-1СУ, кур-совую систему "ГРЕБЕНЬ-1" ножной демпфер, триммер, фрикцион, аппаратуру ДИСС-15, радиовысотомер РВ-5М, основную гидросистему.















ПРИМЕЧАНИЕ:  В дальнейшем при описании методики проверок и регулировки САУ под током, приведенных в технологических картах, предполагается, что источники питания, бортовые системы и агрегаты, взаимодействующие с САУ, включены и функцио-нируют нормально.

- При проведении проверок канала высоты ручку "ШАГ-ГАЗ" установите на 5°-7° по указателю УШВ-1К.
- При описании всех проверок имеется ввиду поочередная задача сигналов обеих полярностей (вторая полярность указана в скобках).
- При описании всех проверок отклонение подписного индекса нулевого индикатора на пульте управления указано относительно лицевой панели пульта управления соответствующего канала.


Проверьте сигнализацию отказов при отсутствии питания и неисправности взаимо-действующих изделий, для чего:
- отключите питание постоянным током, нажав на  кнопку "ОТКЛ. АП" на ручке цик-лического шага летчика;






- включите питание  постоянным током, нажав  кнопки-лампочки "ВКЛ. " на пультах "Н", "К", "Т", "В", а также кнопки-табло   "ВЫСОТА" на  пульте ПВП и "МАРШРУТ" на пульте  ПВМ.








- аналогично выполните проверку, отключая и включая источник питать переменным током;














- нажмите, не отпуская, контрольный выключатель "ГОТОВНОСТЬ ДИСС" на панели технологического жгута 
24-7100-70, предварительно подключив его к контрольному разъему САУ (или на панели контрольных разъемов САУ, размещенной слева сзади си-дения оператора);



- задайте от пульта контроля ДИСС-15 задачу № 3;



- нажмите кнопку-табло "МАРШРУТ" на пульте ПВМ и отпустите.



- нажмите, не отпуская, кнопку согласования курсовой системы;





















- нажмите, не отпуская, на кнопку-табло "МАРШРУТ" на пульте ПВМ.







- отпустите кнопку -табло "МАРШРУТ".











- отпустите кнопку согласования курсовой системы;



- нажмите ни кнопку-табло "МАРШРУТ" пульта ПВМ;







- отпустите контрольный выключатель "ГОТОВНОСТЬ ДИСС";













- поочередно нажмите на кнопки-табло "ВИСЕНИЕ", "МАРШРУТ" пульта ПВМ и "ВЫСОТА" пульта ПВП;







- задайте от пульта контроля ДИСС-15 задачу № 2;



- нажмите, не отпуская, контрольный выключатель "ГОТОВНОСТЬ ДИСС" на панели технологического жгута;

- нажмите на кнопку-табло "ВИСЕНИЕ" пульта ПВМ;









- отпустите контрольный выключатель "ГОТОВНОСТЬ ДИСС";









- нажмите, не отпуская, контрольный выключатель "ГОТОВНОСТЬ ДИСС" на панели технологического жгута;
- нажмите на кнопку-табло "ВЫСОТА" на пульте ПВП;

- нажмите кнопку фрикциона на ручке "ШАГ-ГАЗ" летчика.


























- нажмите кнопку-лампочку "ВКЛ" на пульте управления канала высоты;












- нажмите кнопку фрикциона на ручке "ШАГ-ГАЗ" оператора;














- нажмите кнопку-лампочку "ВКЛ. " на пульте управления канала тангажа;












- нажмите кнопку "СТАБИЛ. СКОРОСТИ" па ловом переднем пульте летчика;










- нажмите кнопку "ОТКЛ. СКОРОСТИ" на левом переднем пульте летчика;
















- нажмите кнопку  "СТАБИЛ. СКОРОСТИ";










- нажмите кнопку-лампочку  "ОТКЛ. " на пульте управления канала тангажа;
















- задайте от пульта контроля ДИСС-15 задачу № 2;
- нажмите, не отпуская, контрольный вы-ключатель "ГОТОВНОСТЬ ДИСС" на панели технологического жгута;

Проверьте включение и отключение САУ. для чего:
- нажмите кнопку -лампочку "ВКЛ." на всех пультах управления "Н", "К", "Т", "В":

- нажмите кнопку-табло "ОТКЛ. " на пульте ПВП;


















- повторите проверку, производя отключение кнопкой "ОТКЛ. АП" на ручке управле-ния вертолетом летчика;


















- нажмите кнопку-табло "ВИСЕНИЕ" на пульте ПВМ;






- нажмите кнопку-табло "МАРШРУТ" на пульте ПВМ;

























- задайте от пульта контроля ДДИСС-15 за-дачу № 3;













- нажмите на кнопку-табло "ВЫСОТА" на пульте ПВП;





















- нажмите на кнопку-табло "МАРШРУТ" на пульте ПВМ;















- нажмите кнопку-табло "ВЫСОТА" на пульте ПВП;



















 нажмите на  кнопку-табло "ВИСЕНИЕ";



























- нажмите на кнопку-табло "ОТКЛ," на пульте ПВМ;







- повторите проверку,  производя отключение кнопкой "ОТКЛ. АП" на ручке управле-ния вертолетом летчика;









- отпустите контрольный выключатель "ГОТОВНОСТЬ ДИСС"

Проверьте работу механизмов согласования:
А. Канала направления:
- установите на пульте управления курсовой системы переключатель режимов работы в положение "ЗК", на счетчике магнитного склонения коррекционного механизма показание, равное нулю, и нажмите кнопку согласования на пульте управления;
- установите на счетчике магнитных склонений коррекционного механизма со знаком "+" ("-")  значение 50°-60°,  нажмите кнопку согласования и удерживайте ее в нажатом состоянии;































- отпустите кнопку согласования



Б. Канал крена:
- отклоните в пределах амортизаторов левую гировертикаль в сторону правого (левого) крена




















В. Канал тангажа:
- отклоните в пределах амортизаторов левую гировертикаль на пикирование (кабрирование).






























Проверьте прохождение сигнала угла и высоты
А. Канал направления:

- снимите ноги с педалей, нажмите кнопка-лампочка "ВКЛ." на пульте управления канала направления;






















- поверните шкалу ручки центровки на пульте управления канала направления по ча-совой стрелке (против часовой стрелки) на три деления (что соответствует рассогласова-нию в 3°);




























- поставьте ноги на педали;












































- снимите ноги с педалей
- поверните шкалу ручки центровки на пульте удавления канала направления по (про-тив) часовой стрелке на 3°;

- включите демпфер педалей;


- поверните ручку центровки на пульте управления канала направления по часовой стрелке  (против часовой стрелки) на 3°;

Г, Канал тангажа

- нажмите кнопку триммера на ручке управления вертолетом летчика;

Проверьте работоспособность КДК, для че-го:

    </div>
  </div>
</div>

<script>
  const rowsEl = document.getElementById("rows");
  const noteEl = document.getElementById("modeNote");

  function sanitizeText(str){
    if(!str) return "";
    str = str.replace(/\r\n/g,"\n").replace(/\r/g,"\n").replace(/\u00A0/g," ");
    str = str.replace(/\t/g,"    ");
    str = str.split("\n").map(l => l.replace(/[ \u00A0]+$/g,"")).join("\n");
    str = str.replace(/\n{6,}/g,"\n\n\n");
    return str;
  }

  function insertPlainTextAtCursor(text){
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0) return;
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const node = document.createTextNode(text);
    range.insertNode(node);
    range.setStartAfter(node);
    range.setEndAfter(node);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function syncRowHeight(rowEl){
    const boxes = [...rowEl.querySelectorAll(".box")];
    boxes.forEach(b => b.style.minHeight = "120px");
    const h = Math.max(...boxes.map(b => b.scrollHeight));
    boxes.forEach(b => b.style.minHeight = Math.max(120, h) + "px");
  }

  function makeBox(value, ph, onInput){
    const box = document.createElement("div");
    box.className = "box";
    box.contentEditable = "true";
    box.dataset.ph = ph;
    box.innerText = value || "";

    box.addEventListener("paste", (e) => {
      e.preventDefault();
      const cd = e.clipboardData || window.clipboardData;
      const plain = cd ? cd.getData("text/plain") : "";
      insertPlainTextAtCursor(sanitizeText(plain));
      onInput(box.innerText);
    });

    box.addEventListener("input", () => onInput(box.innerText));
    return box;
  }

  let items = [];

  function seedOnce(){
    const op = sanitizeText(document.getElementById("seed_op").value);
    const tt = sanitizeText(document.getElementById("seed_tt").value);
    const dev = sanitizeText(document.getElementById("seed_dev").value);

    // ОДНА операция (один пункт) = три колонки напротив.
    // Если хочешь "много пунктов" — потом разобьём по маркерам, но сейчас спасаем то, что ты набрал.
    items = [{ op, tt, dev }];
  }

  function render(){
    rowsEl.innerHTML = "";

    items.forEach((it, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "wrapRow";

      const top = document.createElement("div");
      top.className = "rowTop";

      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = `Пункт ${idx+1}`;

      const ctrls = document.createElement("div");
      ctrls.style.display="flex";
      ctrls.style.gap="6px";

      const up = document.createElement("button");
      up.className="mini"; up.textContent="↑";
      up.onclick=()=>move(idx,-1);

      const down = document.createElement("button");
      down.className="mini"; down.textContent="↓";
      down.onclick=()=>move(idx,+1);

      const del = document.createElement("button");
      del.className="mini"; del.textContent="✕";
      del.onclick=()=>remove(idx);

      ctrls.append(up,down,del);
      top.append(tag,ctrls);

      const row = document.createElement("div");
      row.className="row";

      const c1 = document.createElement("div"); c1.className="cell";
      const c2 = document.createElement("div"); c2.className="cell";
      const c3 = document.createElement("div"); c3.className="cell";

      const b1 = makeBox(it.op, "Содержание операции…", (v)=>{ items[idx].op=v; syncRowHeight(row); });
      const b2 = makeBox(it.tt, "ТТ напротив…", (v)=>{ items[idx].tt=v; syncRowHeight(row); });
      const b3 = makeBox(it.dev,"Отклонения напротив…",(v)=>{ items[idx].dev=v; syncRowHeight(row); });

      c1.appendChild(b1); c2.appendChild(b2); c3.appendChild(b3);
      row.append(c1,c2,c3);

      wrap.append(top,row);
      rowsEl.appendChild(wrap);

      requestAnimationFrame(()=>syncRowHeight(row));
    });

    noteEl.innerHTML = `Пунктов: <b>${items.length}</b>. На телефоне листай таблицу вбок — так сохраняется “напротив”.`;
  }

  function add(){
    items.push({op:"",tt:"",dev:""});
    render();
  }
  function remove(i){
    items.splice(i,1);
    if(items.length===0) items=[{op:"",tt:"",dev:""}];
    render();
  }
  function move(i,dir){
    const j=i+dir;
    if(j<0||j>=items.length) return;
    const t=items[i]; items[i]=items[j]; items[j]=t;
    render();
  }

  function saveHtmlCopy(){
    // Сохраняем КОПИЮ HTML, где тексты уже лежат в textarea
    const html = document.documentElement.outerHTML;

    // Подставляем актуальные значения в seed textarea
    const op = items.map(x=>x.op).join("\n");
    const tt = items.map(x=>x.tt).join("\n");
    const dev = items.map(x=>x.dev).join("\n");

    const replaced = html
      .replace(/<textarea id="seed_op">[\s\S]*?<\/textarea>/m, `<textarea id="seed_op">\n${escapeHtml(op)}\n      </textarea>`)
      .replace(/<textarea id="seed_tt">[\s\S]*?<\/textarea>/m, `<textarea id="seed_tt">\n${escapeHtml(tt)}\n      </textarea>`)
      .replace(/<textarea id="seed_dev">[\s\S]*?<\/textarea>/m, `<textarea id="seed_dev">\n${escapeHtml(dev)}\n      </textarea>`);

    const blob = new Blob([replaced], {type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "p0_saved.html";
    a.click();
    URL.revokeObjectURL(url);
  }

  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");
  }

  document.getElementById("addRow").addEventListener("click", add);
  document.getElementById("saveHtml").addEventListener("click", saveHtmlCopy);
  document.getElementById("print").addEventListener("click", () => window.print());

  // старт
  seedOnce();
  render();
</script>
</body>
</html>
