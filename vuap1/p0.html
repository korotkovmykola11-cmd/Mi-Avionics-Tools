function sanitize(s){
  if(s==null) return "";
  return String(s).replace(/\r\n/g,"\n").replace(/\r/g,"\n").replace(/\u00A0/g," ").replace(/\t/g,"    ")
    .split("\n").map(l=>l.replace(/\s+$/,"")).join("\n");
}

function syncH(rowEl){
  const boxes=[...rowEl.querySelectorAll(".box")];
  boxes.forEach(b=>b.style.minHeight="110px");
  const h=Math.max(...boxes.map(b=>b.scrollHeight));
  boxes.forEach(b=>b.style.minHeight=Math.max(110,h)+"px");
}

function pasteText(text){
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0)return;
  const r=sel.getRangeAt(0);r.deleteContents();
  const n=document.createTextNode(text);
  r.insertNode(n);r.setStartAfter(n);r.setEndAfter(n);
  sel.removeAllRanges();sel.addRange(r);
}

function makeBox(val,ph,cb){
  const b=document.createElement("div");
  b.className="box";b.contentEditable="true";b.dataset.ph=ph;
  b.innerText=val||"";
  b.addEventListener("paste",e=>{
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData("text/plain");
    pasteText(sanitize(t));cb(b.innerText);
  });
  b.addEventListener("input",()=>cb(b.innerText));
  return b;
}

    c2.appendChild(makeBox(it.tt,"Технические требования...",v=>{items[i].tt=sanitize(v);syncH(row)}));
    c3.appendChild(makeBox(it.dev,"Работы при отклонениях...",v=>{items[i].dev=sanitize(v);syncH(row)}));
    row.append(c1,c2,c3);w.append(top,row);rowsEl.appendChild(w);
    requestAnimationFrame(()=>syncH(row));
  });
  noteLeft.innerHTML="Пунктов: <b>"+items.length+"</b>";
  noteRight.innerHTML="Хранилище: <b>LocalStorage / JSON / HTML</b>";
}

function add(){items.push({op:"",tt:"",dev:""});render()}
function remove(i){if(!confirm("Удалить пункт "+(i+1)+"?"))return;items.splice(i,1);if(!items.length)items=[{op:"",tt:"",dev:""}];render()}
function move(i,d){const j=i+d;if(j<0||j>=items.length)return;const t=items[i];items[i]=items[j];items[j]=t;render()}

function payload(){
  return {version:1,exported_at:new Date().toISOString(),
    items:items.map(x=>({op:sanitize(x.op),tt:sanitize(x.tt),dev:sanitize(x.dev)}))};
}
function dl(name,text,mime){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function downloadHtml(){
  const p=payload();
  const html=document.documentElement.outerHTML;
  const replaced=html.replace(
    /const EMBEDDED_EXPORT\s*=\s*\{[\s\S]*?\n\};/,
    "const EMBEDDED_EXPORT = "+esc(JSON.stringify(p,null,2))+";"
  );
  dl("techcard_saved.html",replaced,"text/html;charset=utf-8");
}

function saveLocal(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(payload()));alert("Сохранено в LocalStorage.")}
  catch(e){alert("Ошибка сохранения. Используйте 'Скачать HTML'.")}
}
function loadLocal(){
  const r=localStorage.getItem(STORAGE_KEY);
  if(!r){alert("В LocalStorage ничего нет.");return}
  try{const o=JSON.parse(r);if(!o||!Array.isArray(o.items))throw 0;
    items=o.items.map(x=>({op:sanitize(x.op),tt:sanitize(x.tt),dev:sanitize(x.dev)}));render();
    alert("Загружено.");}catch(e){alert("Ошибка чтения.")}
}
function exportJson(){dl("techcard_export.json",JSON.stringify(payload(),null,2),"application/json;charset=utf-8")}
function importJson(){fileInput.value="";fileInput.click()}

fileInput.addEventListener("change",async()=>{
  const f=fileInput.files&&fileInput.files[0];if(!f)return;
  try{const o=JSON.parse(await f.text());if(!o||!Array.isArray(o.items))throw 0;
    items=o.items.map(x=>({op:sanitize(x.op),tt:sanitize(x.tt),dev:sanitize(x.dev)}));render();
    alert("Импорт выполнен.");}catch(e){alert("Неверный формат JSON.")}
});

document.getElementById("saveLocal").addEventListener("click",saveLocal);
document.getElementById("loadLocal").addEventListener("click",loadLocal);
document.getElementById("downloadHtml").addEventListener("click",downloadHtml);
document.getElementById("exportJson").addEventListener("click",exportJson);
document.getElementById("importJson").addEventListener("click",importJson);
document.getElementById("addRow").addEventListener("click",add);
document.getElementById("print").addEventListener("click",()=>window.print());

(function init(){
  const src=EMBEDDED_EXPORT&&Array.isArray(EMBEDDED_EXPORT.items)?EMBEDDED_EXPORT.items:[{op:"",tt:"",dev:""}];
  items=src.map(x=>({op:sanitize(x.op),tt:sanitize(x.tt),dev:sanitize(x.dev)}));
  render();
})();
</script>
</body>
</html>
